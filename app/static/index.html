<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#f7f8fa">
    <title>Wander Pico · Local place discovery</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260905-refresh">
  </head>
  <body class="auth-locked">
    <div id="app"></div>
    <template id="place-template">
      <article class="place-card">
        <div class="place-visual" aria-hidden="true">
          <span class="map-road road-one"></span>
          <span class="map-road road-two"></span>
          <span class="map-road road-three"></span>
          <span class="place-pin">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z" fill="currentColor"></path>
              <circle cx="12" cy="10" r="2.1" fill="white"></circle>
            </svg>
          </span>
          <span class="place-type"></span>
          <span class="place-number"></span>
        </div>
        <div class="place-body">
          <h3></h3>
          <p class="address"></p>
          <div class="rating-row">
            <span class="rating"></span>
            <span class="review-count"></span>
          </div>
          <div class="card-actions">
            <a class="place-maps-link" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              <span>Open map</span>
            </a>
            <button class="map-button" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m3.5 6 5-2.5 7 3 5-2.5v14l-5 2.5-7-3-5 2.5V6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                <path d="M8.5 3.5v14M15.5 6.5v14" stroke="currentColor" stroke-width="1.6"></path>
              </svg>
              <span>View map</span>
            </button>
          </div>
        </div>
      </article>
    </template>
    <script type="module" src="/static/ui.js"></script>
  </body>
</html>
